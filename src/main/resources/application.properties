# ============================================================
# AI Agent Gateway - Application Configuration
# ============================================================

spring.application.name=ai-agent-gateway
server.port=8080
spring.profiles.active=default

# ============================================================
# Groq API Configuration
# 1. Go to: https://console.groq.com
# 2. Sign up free (no credit card, works in India)
# 3. API Keys -> Create API Key (starts with gsk_...)
# 4. Set in PowerShell: $env:GROQ_API_KEY="gsk_..."
# Free tier: 30 req/min, 14,400 req/day
# ============================================================
groq.api.key=${GROQ_API_KEY:your-groq-key-here}
groq.model=llama-3.3-70b-versatile

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=AI Agent Gateway
info.app.version=1.0.0
info.app.description=AI-as-a-Service using Groq LLaMA, managed by Apigee

# ============================================================
# Logging
# ============================================================
logging.level.com.aigateway=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{25} - %msg%n
